<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Modern Squircle Base -->
  <rect width="100" height="100" rx="22" fill="url(#logoBgGrad)"/>

  <!-- Subtle Concentric Radar Rings -->
  <circle cx="50" cy="50" r="34" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="22" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Radar Scanning Arc -->
  <path d="M 50 28 A 22 22 0 0 1 72 50" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Target Reticle Crosshair Ticks -->
  <line x1="50" y1="12" x2="50" y2="20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="80" x2="50" y2="88" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="20" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="88" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Ascending Tender Analytics Pulse -->
  <polyline points="28,64 42,54 54,58 72,36" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Target Scoring Star Peak -->
  <circle cx="72" cy="36" r="4.5" fill="#FACC15"/>
  <circle cx="72" cy="36" r="2" fill="#FFFFFF"/>
</svg>
