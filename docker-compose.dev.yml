# Dev override: mount source code truc tiep, bat hot reload
# Dung: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# KHONG commit file nay, da co trong .gitignore

services:
  backend:
    build:
      context: ./apps/backend
      target: build
    volumes:
      - ./apps/backend:/app
      - tender_attachments_data:/app/storage
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    environment:
      NODE_ENV: development

  frontend:
    build:
      context: ./apps/frontend
      target: build
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 80
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      FRONTEND_PORT: ${FRONTEND_PORT}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      PORT: ${PORT}

  crawler-worker:
    volumes:
      - muasamcong_token_data:/app/data
      - tender_attachments_data:/app/storage
      - ./apps/crawler-worker:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
